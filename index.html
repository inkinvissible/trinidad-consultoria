<!-- Javascript formulario de contacto-->
<script>
    document.getElementById("whatsappForm").addEventListener("submit", function (event) {
        event.preventDefault(); // Evita el envío tradicional del formulario

        let numero = "5493512328943"; // Reemplaza con tu número de WhatsApp (sin + ni espacios)
        let mensaje = document.getElementById("message").value.trim();

        if (mensaje === "") {
            alert("Por favor, escribe un mensaje antes de enviar.");
            return;
        }

        let url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, "_blank"); // Abre WhatsApp en una nueva pestaña
    });
</script>

<script>
    document.querySelectorAll('.accordion-button').forEach(button => {
        button.addEventListener('click', function () {
            const target = document.querySelector(this.getAttribute('data-bs-target'));
            if (target.classList.contains('show')) {
                const collapse = bootstrap.Collapse.getInstance(target);
                collapse.hide();
            }
        });
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const navLinks = document.querySelectorAll(".nav-link");
        const navbarCollapse = document.getElementById("navbarCollapse");

        navLinks.forEach(function (link) {
            link.addEventListener("click", function () {
                // Verificamos si el menú está expandido
                const isExpanded = navbarCollapse.classList.contains("show");
                if (isExpanded) {
                    new bootstrap.Collapse(navbarCollapse).hide();
                }
            });
        });
    });
</script>
